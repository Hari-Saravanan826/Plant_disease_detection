<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Prediction Result</h1>

        <div class="result-card">
            <p class="label">Predicted disease</p>
            <h2 class="disease">{{ disease }}</h2>
            <p class="confidence">Confidence: <strong>{{ confidence }}%</strong></p>
        </div>

        <div class="top3">
            <h3>Top 3 predictions</h3>
            <ol>
                {% for name, score in top3 %}
                    <li>
                        <span class="name">{{ name }}</span>
                        <span class="score">{{ "%.2f"|format(score) }}%</span>
                    </li>
                {% endfor %}
            </ol>
        </div>

        <a href="/" class="back-button">Classify another image</a>
    </div>
</body>
</html>
<!-- Mobile & PWA -->
<meta name="theme-color" content="#2d6a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlantScan">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
